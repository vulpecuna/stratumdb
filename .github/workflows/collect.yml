name: collect

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Collect
        run: python collect.py all --jobs 12 --deadline-minutes 45
      - name: Check
        run: python check.py
      - name: Commit
        run: |
          git add -A data state
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "data: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 10))
          done
          exit 1
      # A version list that stopped looking like itself (a repository re-created by
      # somebody else under the same name) was not written. The run is red until a
      # person reads state/quarantine.json and removes the entry.
      - name: Quarantine
        run: |
          if [ -s state/quarantine.json ] && [ "$(cat state/quarantine.json)" != "{}" ]; then
            cat state/quarantine.json
            echo "::error::a version list is quarantined; see state/quarantine.json"
            exit 1
          fi
